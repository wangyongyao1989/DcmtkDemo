width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="160" y="318" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="160" y="368" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="160" y="418" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="210" y="118" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="210" y="168" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="210" y="218" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="210" y="268" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="210" y="318" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="210" y="368" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="210" y="418" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="260" y="118" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="260" y="168" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="260" y="218" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="260" y="268" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="260" y="318" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="260" y="368" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="260" y="418" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="310" y="118" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="310" y="168" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="310" y="218" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="310" y="268" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="310" y="318" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="310" y="368" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="310" y="418" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="360" y="118" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="360" y="168" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="360" y="218" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="360" y="268" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="360" y="318" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="360" y="368" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="360" y="418" width="50" height="50" fill="#b3382c" opacity="0.51"/><rect x="410" y="118" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="410" y="168" width="50" height="50" fill="#b3382c" opacity="0.65"/><rect x="410" y="218" width="50" height="50" fill="#b3382c" opacity="0.51"/><rect x="410" y="268" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="410" y="318" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="410" y="368" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="410" y="418" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="460" y="118" width="50" height="50" fill="#b3382c" opacity="0.24"/><rect x="460" y="168" width="50" height="50" fill="#b3382c" opacity="0.38"/><rect x="460" y="218" width="50" height="50" fill="#b3382c" opacity="0.24"/><path d="M115,104 L470,163 L415,473 L46,408 Z" fill="none" stroke="#b3382c" stroke-width="2.4"/><line x1="60" y1="118" x2="60" y2="468" stroke="#c3ccd6" stroke-width="1"/><line x1="110" y1="118" x2="110" y2="468" stroke="#c3ccd6" stroke-width="1"/><line x1="160" y1="118" x2="160" y2="468" stroke="#c3ccd6" stroke-width="1"/><line x1="210" y1="118" x2="210" y2="468" stroke="#c3ccd6" stroke-width="1"/><line x1="260" y1="118" x2="260" y2="468" stroke="#c3ccd6" stroke-width="1"/><line x1="310" y1="118" x2="310" y2="468" stroke="#c3ccd6" stroke-width="1"/><line x1="360" y1="118" x2="360" y2="468" stroke="#c3ccd6" stroke-width="1"/><line x1="410" y1="118" x2="410" y2="468" stroke="#c3ccd6" stroke-width="1"/><line x1="460" y1="118" x2="460" y2="468" stroke="#c3ccd6" stroke-width="1"/><line x1="510" y1="118" x2="510" y2="468" stroke="#c3ccd6" stroke-width="1"/><line x1="60" y1="118" x2="510" y2="118" stroke="#c3ccd6" stroke-width="1"/><line x1="60" y1="168" x2="510" y2="168" stroke="#c3ccd6" stroke-width="1"/><line x1="60" y1="218" x2="510" y2="218" stroke="#c3ccd6" stroke-width="1"/><line x1="60" y1="268" x2="510" y2="268" stroke="#c3ccd6" stroke-width="1"/><line x1="60" y1="318" x2="510" y2="318" stroke="#c3ccd6" stroke-width="1"/><line x1="60" y1="368" x2="510" y2="368" stroke="#c3ccd6" stroke-width="1"/><line x1="60" y1="418" x2="510" y2="418" stroke="#c3ccd6" stroke-width="1"/><line x1="60" y1="468" x2="510" y2="468" stroke="#c3ccd6" stroke-width="1"/><text x="60" y="92" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13"  fill="#b3382c" text-anchor="start">ROI 边界（阈值面 / 空间盒 / 球面 / 平面多边形都走同一套判定）</text><rect x="260" y="218" width="50" height="50" fill="none" stroke="#2f6fd0" stroke-width="3"/><circle cx="260" cy="218" r="6" fill="#2f6fd0" stroke="#2f6fd0" stroke-width="2"/><circle cx="260" cy="268" r="6" fill="#2f6fd0" stroke="#2f6fd0" stroke-width="2"/><circle cx="310" cy="218" r="6" fill="#2f6fd0" stroke="#2f6fd0" stroke-width="2"/><circle cx="310" cy="268" r="6" fill="#2f6fd0" stroke="#2f6fd0" stroke-width="2"/><rect x="268" y="232" width="34" height="24" rx="5" fill="#ffffff" opacity="0.9"/><text x="285.0" y="250" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15"  font-weight="600" fill="#2f6fd0" text-anchor="middle">0.75</text><text x="60" y="502" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13.5"  fill="#2f6fd0" text-anchor="start">实心 = 角点在 ROI 内，空心 = 在外：蓝框体素 3/4 在内 → w = 0.75；3D 里同理，8 角点 → w ∈ {0, 1/8, …, 1}</text><text x="60" y="530" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13.5"  fill="#1f2933" text-anchor="start">整格判定（w 只能是 0 或 1）= 阶梯误差，且不随体素变细而收敛；角点权重与「逐角点定义」逐位一致。</text><text x="60" y="558" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13.5"  fill="#5f6b7a" text-anchor="start">R-06（AI 掩膜 ROI）走同一条 analyze，自动分割的体积与手工 ROI 同一口径。</text><rect x="760" y="118" width="380" height="92" rx="9" fill="#eefaf1" stroke="#2e8b57" stroke-width="1.4"/><text x="950.0" y="154.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle">coverageVoxels = Σ w(v)</text><text x="950.0" y="169.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">volumeMm3 = Σ w(v) × 单个体素体积</text><text x="950.0" y="186.5" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">meanHu = Σ w·hu / Σ w（权重可非整数）</text><rect x="760" y="232" width="380" height="92" rx="9" fill="#eef4fd" stroke="#2f6fd0" stroke-width="1.4"/><text x="950.0" y="268.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle">快速路径：只扫包围盒</text><text x="950.0" y="283.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">spatialBoundsAt 给索引区间</text><text x="950.0" y="300.5" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">只有边界格走 8 角点判定</text><rect x="760" y="346" width="380" height="92" rx="9" fill="#fff5e8" stroke="#c9761f" stroke-width="1.4"/><text x="950.0" y="382.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle">验收口径</text><text x="950.0" y="397.0" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">AC：M-04 体积相对误差 ≤1%</text><text x="950.0" y="414.5" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle">RoiStats 带 scanned/coverage 取证</text></svg>